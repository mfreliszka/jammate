[project]
name = "jammate"
version = "0.1.0"
description = "Local realtime jam companion for bass: a virtual drummer and AI accompaniment that listen and follow the player."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "magenta-rt[mlx]>=2.0.3",
    "mlx==0.31.2",
    "numpy>=2.3.5",
    "pydantic>=2.14.0",
    "pyside6>=6.12.0",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
jammate = "jammate.main:main"

[build-system]
requires = ["uv_build>=0.7.6,<0.8"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
# Ruff also formats Python snippets inside Markdown; the docs' illustrative snippets stay as written.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
